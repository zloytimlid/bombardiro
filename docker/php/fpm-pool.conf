; Пул PHP-FPM для локальной разработки и E2E (раздел 9): кооператив из 3–8 вкладок шлёт пульсы,
; журнал, снапшоты мира и опрос разбора — пяти процессов по умолчанию мало: пульс хоста ждёт в очереди,
; сервер считает хоста пропавшим и выбирает нового.
[www]
pm = dynamic
pm.max_children = 24
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 10
pm.max_requests = 500
