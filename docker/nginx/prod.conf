map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 64m;

    # За TLS-прокси (Caddy): реальный адрес клиента.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;

    # DNS Docker: контейнеры app/reverb могут пересоздаваться с новыми IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;
    set $reverb_upstream http://reverb:8080;

    # Заголовки безопасности и CSP ставит приложение (App\Http\Middleware\SecurityHeaders); здесь — только для статики.
    location ~* \.(?:js|css|svg|png|ico|woff2?|webp|mp3|ogg)$ {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # WebSocket Reverb (протокол Pusher)
    location /app {
        proxy_pass $reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /apps {
        proxy_pass $reverb_upstream;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Время прихода запроса — для пульса хоста кооператива (Protocol::arrivedAt).
        fastcgi_param REQUEST_START $msec;
        # Заголовок Link с предзагрузкой всех чанков сборки (AddLinkHeadersForPreloadedAssets) больше буфера по
        # умолчанию (4–8 КБ): nginx отвечал 502 «upstream sent too big header».
        fastcgi_buffer_size 64k;
        fastcgi_buffers 16 32k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
