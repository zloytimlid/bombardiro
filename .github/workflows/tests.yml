name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DB_CONNECTION: pgsql
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_DATABASE: b25j_testing
  DB_USERNAME: b25j
  DB_PASSWORD: secret
  REDIS_HOST: 127.0.0.1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, intl, pcntl
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci --no-audit --no-fund
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan wayfinder:generate --with-form --no-interaction
      - name: Pint
        run: composer lint:check
      - name: Larastan (level 8)
        run: composer types:check
      - name: ESLint
        run: npm run lint
      - name: tsc --noEmit
        run: npm run types:check
      - name: Audit
        run: composer audit && npm audit --omit=dev --audit-level=high

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: b25j_testing
          POSTGRES_USER: b25j
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U b25j" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, redis, intl, pcntl
          tools: composer:v2
          coverage: pcov
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci --no-audit --no-fund
      - run: cp .env.example .env && php artisan key:generate
      - name: Build assets
        run: npm run build
      - name: Bundle budget (section 13)
        run: npm run budget:bundle
      - name: Pest
        run: php artisan test --parallel
      - name: Vitest
        run: npm run test:js
      - name: Migrations are reversible
        run: php artisan migrate:fresh --force && php artisan migrate:rollback --force && php artisan migrate --seed --force
        env:
          SEED_ADMIN_PASSWORD: ci-only-password

  e2e:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: cp .env.example .env
      - name: Start stack
        run: |
          docker compose up -d --build --wait app nginx reverb horizon postgres redis s3 mailpit
          docker compose exec -T app php artisan migrate --seed --force
          docker compose exec -T app sh -c 'npm ci --no-audit --no-fund && npm run build'
        env:
          SEED_ADMIN_PASSWORD: ci-only-password
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
      - if: always()
        run: docker compose logs --no-color > compose.log; docker compose down -v
