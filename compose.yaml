name: b25j

x-php: &php
    build:
        context: .
        dockerfile: docker/php/Dockerfile
    image: b25j-php:dev
    volumes:
        - .:/var/www/html
        # vendor/ — в томе Docker: bind-mount с Windows слишком медленный для тысяч файлов.
        - vendor:/var/www/html/vendor
    environment: &php-env
        DB_HOST: postgres
        REDIS_HOST: redis
        REVERB_SERVER_HOST: 0.0.0.0
        REVERB_SERVER_PORT: '8080'
    depends_on:
        postgres:
            condition: service_healthy
        redis:
            condition: service_healthy
    restart: unless-stopped

services:
    app:
        <<: *php
        environment:
            <<: *php-env
            APP_BOOTSTRAP: '1'

    nginx:
        image: nginx:1.27-alpine
        ports:
            - '${APP_PORT:-8000}:80'
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
            - reverb
        restart: unless-stopped

    reverb:
        <<: *php
        command:
            ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080']

    horizon:
        <<: *php
        command: ['php', 'artisan', 'horizon']

    scheduler:
        <<: *php
        command: ['php', 'artisan', 'schedule:work']

    vite:
        <<: *php
        command: ['sh', '-c', 'npm ci --no-audit --no-fund && npm run dev']
        ports:
            - '${VITE_PORT:-5173}:5173'
        volumes:
            - .:/var/www/html
            - vendor:/var/www/html/vendor
            - node_modules:/var/www/html/node_modules
        environment:
            <<: *php-env
            VITE_DEV_SERVER_HOST: 0.0.0.0

    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: b25j
            POSTGRES_USER: b25j
            POSTGRES_PASSWORD: secret
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        volumes:
            - postgres:/var/lib/postgresql/data
            - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U b25j -d b25j']
            interval: 3s
            timeout: 3s
            retries: 20
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - redis:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 3s
            timeout: 3s
            retries: 20
        restart: unless-stopped

    # S3-совместимое хранилище для dev (MinIO больше не публикует образы — ADR-0003).
    s3:
        image: chrislusf/seaweedfs:latest
        command:
            [
                'server',
                '-dir=/data',
                '-ip.bind=0.0.0.0',
                '-master.volumeSizeLimitMB=256',
                '-s3',
                '-s3.port=9000',
                '-s3.config=/etc/seaweedfs/s3.json',
            ]
        ports:
            - '${FORWARD_S3_PORT:-9000}:9000'
        volumes:
            - s3:/data
            - ./docker/s3/s3.json:/etc/seaweedfs/s3.json:ro
        healthcheck:
            test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9000/healthz || exit 1']
            interval: 3s
            timeout: 3s
            retries: 40
        restart: unless-stopped

    s3-init:
        image: amazon/aws-cli:latest
        depends_on:
            s3:
                condition: service_healthy
        environment:
            AWS_ACCESS_KEY_ID: b25j-dev
            AWS_SECRET_ACCESS_KEY: b25j-dev-secret
            AWS_DEFAULT_REGION: us-east-1
        entrypoint:
            [
                'sh',
                '-c',
                'aws --endpoint-url http://s3:9000 s3api head-bucket --bucket b25j 2>/dev/null || aws --endpoint-url http://s3:9000 s3 mb s3://b25j',
            ]
        restart: 'no'

    mailpit:
        image: axllent/mailpit:latest
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        restart: unless-stopped

volumes:
    postgres:
    redis:
    s3:
    vendor:
    node_modules:
